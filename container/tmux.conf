# pi-cloud tmux config — pi needs extended keys for Shift+Enter / Ctrl+Enter.
# Requires tmux >= 3.5 (built from source in the image).
set -g extended-keys on
set -g extended-keys-format csi-u

# History + window chrome
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -g mouse on
set -g display-time 2000

# Status bar
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=green]pi #[fg=white]| "
set -g status-right "#[fg=white]%H:%M "

# Escape-time jam (fast key repeats over SSH)
set -sg escape-time 10

# Prevent accidental detach prompt slowdowns
set -g detach-on-destroy on