# In-cluster kubeconfig for the pi box: authenticates with the auto-mounted
# ServiceAccount token (ns: pi, SA: pi-admin -> cluster-admin).
# Works because kubectl supports `tokenFile` and reads the rotated token file
# on every request. Only valid inside the cluster (kubectl falls back to local
# kubeconfig via KUBECONFIG when used outside).
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      server: https://kubernetes.default.svc
    name: in-cluster
contexts:
  - context:
      cluster: in-cluster
      user: pi-admin
    name: in-cluster
current-context: in-cluster
users:
  - name: pi-admin
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token