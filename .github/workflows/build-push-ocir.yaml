name: Build and push OCIR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: vcp.ocir.io
  OCIR_NAMESPACE: axtvnrdemzo7
  IMAGE_NAME: pi-cloud
  # Stable base (node + OS deps + mise/Ruby) built by build-base.yaml.
  # Keep BASE_TAG in sync there; bump it when the base is republished.
  BASE_IMAGE_NAME: pi-cloud-base
  BASE_TAG: ruby-4.0.5-5

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      # When a single merged PR changes the base (docker/base.Dockerfile) and
      # the app together, both workflows start on the same push. build-base
      # must publish BASE_TAG before this build can FROM it — poll the OCIR
      # manifest (authed by the login above) for up to 600s instead of racing.
      # On ordinary pushes the manifest already exists, so this step is a
      # single fast check.
      - name: Wait for base image manifest
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}:${{ env.BASE_TAG }}"
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMG}" >/dev/null 2>&1; then
              echo "base manifest present: ${IMG}"
              exit 0
            fi
            echo "waiting for ${IMG} (${i}/60)"
            sleep 10
          done
          echo "base image ${IMG} not published after 600s" >&2
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys are manual: builds never touch artr-gitops. Promote an image by
  # running the promote workflow (workflow_dispatch) with the tag to deploy.
  # See .github/workflows/promote.yaml.
