name: Build and push OCIR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: vcp.ocir.io
  OCIR_NAMESPACE: axtvnrdemzo7
  IMAGE_NAME: pi-cloud
  # Stable base (node + OS deps + tmux + mise/Ruby) built by build-base.yaml.
  # Keep BASE_TAG in sync there; bump it when the base is republished.
  BASE_IMAGE_NAME: pi-cloud-base
  BASE_TAG: ruby-4.0.5_tmux-3.7c-3

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys are manual: builds never touch artr-gitops. Promote an image by
  # running the promote workflow (workflow_dispatch) with the tag to deploy.
  # See .github/workflows/promote.yaml.
