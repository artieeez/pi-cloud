name: Build and push OCIR base image

on:
  push:
    branches: [main]
    paths:
      - docker/base.Dockerfile
      - .github/workflows/build-base.yaml
  workflow_dispatch:

env:
  REGISTRY: vcp.ocir.io
  OCIR_NAMESPACE: axtvnrdemzo7
  IMAGE_NAME: pi-cloud-base
  # Keep in sync with the ARGs in docker/base.Dockerfile. Bump the counter
  # suffix if you rebuild with the same ruby/tmux versions (e.g. OS update):
  # the app workflow pins this tag, so a new digest needs a new tag.
  # -3: republish after the -2 manifest (digest d204edb8) was reaped from
  # OCIR, leaving -2 and latest dangling; the app workflow pins -2 and its
  # builds failed at FROM until republished.
  BASE_TAG: ruby-4.0.5_tmux-3.7c-3

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.BASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max